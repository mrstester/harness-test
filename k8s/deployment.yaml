apiVersion: apps/v1
kind: Deployment
metadata:
  name: harness-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: harness-demo
  template:
    metadata:
      labels:
        app: harness-demo
    spec:
      containers:
      - name: harness-demo
        image: docker.io/myuser/harness-demo:latest
        ports:
        - containerPort: 5000

---

apiVersion: v1
kind: Service
metadata:
  name: harness-demo
spec:
  selector:
    app: harness-demo
  ports:
  - port: 80
    targetPort: 5000
  type: LoadBalancer
